<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#1a1426"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  style="stop-color:#ffe9a8"/>
      <stop offset="45%" style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#80dfff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#80dfff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes pulse { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
    @keyframes drift { 0%,100% { stroke-dashoffset: 0; } 50% { stroke-dashoffset: 24; } }
    .bolt { animation: pulse 3.6s ease-in-out infinite; }
    .arc1 { stroke-dasharray: 6 6; animation: drift 9s linear infinite; }
  </style>

  <!-- Dark disc -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="#f74c00" stroke-width="3"/>

  <!-- Outer orbit-style ring, dashed (echoes Fe2O3's electron rings,
       but slower and tilted to feel "current flowing", not "atom") -->
  <g class="arc1" fill="none" stroke="url(#ring)" stroke-width="1.4" opacity="0.55">
    <ellipse cx="128" cy="128" rx="104" ry="78" transform="rotate(-20 128 128)"/>
  </g>

  <!-- Lightning bolt — the watt symbol, gradient-filled with glow -->
  <g class="bolt" filter="url(#glow)">
    <path d="M148 36 L74 132 L118 132 L102 220 L184 116 L138 116 L162 36 Z"
          fill="url(#bolt)"
          stroke="#ffe9a8" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
</svg>
